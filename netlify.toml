[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/availability"
  to = "/.netlify/functions/availability"
  status = 200

[[redirects]]
  from = "/api/create-booking"
  to = "/.netlify/functions/create-booking"
  status = 200

[[redirects]]
  from = "/confirmed"
  to = "/confirmed.html"
  status = 200
